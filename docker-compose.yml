---
services:
  otel-collector:
    image: otel/opentelemetry-collector:latest
    container_name: otel-collector
    command: ["--config=/etc/otel-collector-config.yml"]
    volumes:
      - ./otel-collector-config.yml:/etc/otel-collector-config.yml
    ports:
      - "4317:4317"   # OTLP gRPC receiver
      - "4318:4318"   # OTLP HTTP receiver
      - "13133:13133" # OTEL collector health check
    environment:
      SIGNOZ_INGESTION_KEY: admin/admin
    networks:
      - atgraph-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:13133"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    depends_on:
      - signoz
      - signoz-schema-migrator
    restart: unless-stopped

  clickhouse:
    image: clickhouse/clickhouse-server:25.2-alpine
    container_name: clickhouse
    ports:
      - "8123:8123"   # HTTP interface
      - "9000:9000"   # Native interface (TCP)
      - "9009:9009"   # Inter-server communication port
    volumes:
      - clickhouse-data:/var/lib/clickhouse
      - clickhouse-logs:/var/log/clickhouse-server
      - ./clickhouse/config.xml:/etc/clickhouse-server/config.d/custom-config.xml
      - ./clickhouse/users.xml:/etc/clickhouse-server/users.d/custom-users.xml
    environment:
      CLICKHOUSE_DB: atgraph
      CLICKHOUSE_USER: default
      CLICKHOUSE_PASSWORD: ""
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    networks:
      - atgraph-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8123/ping"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  signoz-schema-migrator:
    image: signoz/signoz-schema-migrator:v0.111.36
    container_name: signoz-schema-migrator
    command: "sync --dsn tcp://clickhouse:9000 --up="
    depends_on:
      - clickhouse
    restart: on-failure

  signoz:
    image: signoz/signoz:v0.76.2
    container_name: signoz
    depends_on:
      - clickhouse
      - signoz-schema-migrator
    command:
      - --config=/root/config/prometheus.yml
    volumes:
      - ./prometheus.yml:/root/config/prometheus.yml
      - signoz-data:/var/lib/signoz/
    ports:
      - "8080:8080"  # HTTP UI
    environment:
      SIGNOZ_CLICKHOUSE_USER: default
      SIGNOZ_CLICKHOUSE_PASSWORD: ""
      # https://github.com/SigNoz/charts/blob/01c63614ee73429469795a9fd85a45044569f60b/charts/signoz/templates/_clickhouse.tpl#L29
      # metrics
      # SIGNOZ_CLICKHOUSE_DATABASE: atgraph_o11y_metrics
      # traces
      # SIGNOZ_CLICKHOUSE_TRACE_DATABASE: atgraph_o11y_traces
      # logs
      # SIGNOZ_CLICKHOUSE_LOG_DATABASE: atgraph_o11y_logs
      SIGNOZ_TELEMETRYSTORE_PROVIDER: clickhouse
      SIGNOZ_TELEMETRYSTORE_CLICKHOUSE_DSN: tcp://clickhouse:9000
      GODEBUG: netdns=go 
    networks:
      - atgraph-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped

volumes:
  clickhouse-data:
  clickhouse-logs:
  signoz-data:

networks:
  atgraph-net:
    name: atgraph-net
